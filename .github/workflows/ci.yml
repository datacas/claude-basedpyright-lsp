name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly run to catch regressions from new BasedPyright or Claude Code releases.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate marketplace
        run: claude plugin validate --strict .
      - name: Validate plugin
        run: claude plugin validate --strict plugins/basedpyright-lsp

  lsp-smoke:
    name: LSP smoke test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install BasedPyright
        run: python -m pip install basedpyright
      - name: Show BasedPyright version
        run: basedpyright --version
      - name: Run smoke test
        run: python tests/lsp_smoke.py
