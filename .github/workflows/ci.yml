name: CI

# Pushes and pull requests test against pinned versions (Claude Code below,
# BasedPyright in tests/requirements.txt), so failures point at this repo.
# The weekly scheduled run tests against the latest releases to catch
# upstream regressions early.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      latest:
        description: Test against the latest Claude Code and BasedPyright
        type: boolean
        default: false

permissions:
  contents: read

env:
  CLAUDE_CODE_VERSION: "2.1.302"
  USE_LATEST: ${{ github.event_name == 'schedule' || inputs.latest == true }}

jobs:
  validate:
    name: Validate manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install Claude Code
        shell: bash
        run: |
          if [ "$USE_LATEST" = "true" ]; then
            npm install -g @anthropic-ai/claude-code@latest
          else
            npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
          fi
          claude --version
      - name: Validate marketplace
        run: claude plugin validate --strict .
      - name: Validate plugin
        run: claude plugin validate --strict plugins/basedpyright-lsp

  lsp-smoke:
    name: LSP smoke test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install BasedPyright
        shell: bash
        run: |
          if [ "$USE_LATEST" = "true" ]; then
            python -m pip install --upgrade basedpyright
          else
            python -m pip install -r tests/requirements.txt
          fi
          basedpyright --version
      - name: Run smoke test
        run: python tests/lsp_smoke.py
